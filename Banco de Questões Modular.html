<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Questões – ENEM/Vestibulares</title>
    <style>
        :root {
            --color-primary: #38bdf8;
            --color-primary-dark: #0284c7;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --color-warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #020617 0%, #1e293b 100%);
            border-radius: 12px;
            border-left: 4px solid var(--color-primary);
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--color-primary);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--color-primary);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background-color: var(--color-primary);
            color: #0f172a;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger {
            background-color: var(--color-danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--color-success);
            color: white;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        .tab-btn:hover {
            color: var(--color-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .filter-section {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            background-color: #0f172a;
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .form-section {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            background-color: #0f172a;
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .option-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .option-input input {
            flex: 1;
            padding: 10px;
            background-color: #0f172a;
            color: var(--text-primary);
            border: 1px solid #334155;
            border-radius: 6px;
        }

        .option-letter {
            min-width: 40px;
            padding: 8px 12px;
            background-color: #334155;
            border-radius: 4px;
            font-weight: 700;
            color: var(--color-primary);
            text-align: center;
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .question-card {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--color-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.2);
        }

        .question-card.selected {
            background-color: #1e293b;
            border-left-color: var(--color-success);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .question-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-topic {
            background-color: #334155;
            color: var(--color-primary);
        }

        .badge-bank {
            background-color: #334155;
            color: var(--color-warning);
        }

        .badge-year {
            background-color: #334155;
            color: var(--text-secondary);
        }

        .difficulty {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .difficulty.easy {
            background-color: #064e3b;
            color: var(--color-success);
        }

        .difficulty.medium {
            background-color: #92400e;
            color: var(--color-warning);
        }

        .difficulty.hard {
            background-color: #7f1d1d;
            color: var(--color-danger);
        }

        .question-text {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .question-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: var(--color-primary);
            background-color: #1a2744;
        }

        .option input[type="radio"] {
            cursor: pointer;
            margin-top: 4px;
            width: 18px;
            height: 18px;
        }

        .option-letter-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            padding: 0;
            background-color: #334155;
            border-radius: 50%;
            font-weight: 700;
            color: var(--color-primary);
            text-align: center;
            flex-shrink: 0;
        }

        .option span:not(.option-letter-circle) {
            flex: 1;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .option.selected {
            background-color: #1e4d6b;
            border-color: var(--color-primary);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        .correct-feedback {
            background-color: #064e3b;
            color: var(--color-success);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--color-success);
            margin: 15px 0;
            display: none;
        }

        .incorrect-feedback {
            background-color: #7f1d1d;
            color: var(--color-danger);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--color-danger);
            margin: 15px 0;
            display: none;
        }

        .correct-feedback.show,
        .incorrect-feedback.show {
            display: block;
        }

        .feedback-label {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .feedback p {
            margin: 0;
            line-height: 1.5;
        }

        .stats {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .stat-box {
            text-align: center;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .modal-header h2 {
            color: var(--color-primary);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--color-primary);
        }

        .success-message {
            background-color: #064e3b;
            color: var(--color-success);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--color-success);
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--color-primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #334155;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.6rem;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }

            .option-group {
                grid-template-columns: 1fr;
            }

            .question-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Banco de Questões Completo</h1>
            <p>ENEM/Vestibulares – Gerenciar, Filtrar e Praticar</p>
        </div>

        <div class="tab-container" id="tabContainer"></div>

        <!-- Conteúdo dinâmico das abas -->
        <div id="simulador" class="tab-content active"></div>
        <div id="gerenciador" class="tab-content"></div>
        <div id="importar" class="tab-content"></div>
    </div>

    <!-- MODAL: Adicionar/Editar Questão -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Questão</h2>
                <button class="close-btn" onclick="UI.closeAddModal()">×</button>
            </div>
            <div class="success-message" id="successMessage">✓ Questão salva com sucesso!</div>
            <form id="questionForm"></form>
        </div>
    </div>

    <script>
        // ============================================
        // 1. MÓDULO DE DADOS
        // ============================================
        const DataModule = (() => {
            let questionsData = [
                {
                    id: 1,
                    topic: 'egito',
                    bank: 'enem-2024',
                    difficulty: 'easy',
                    text: 'O historiador grego Heródoto afirmou: "O Egito é uma dádiva do rio Nilo". Essa frase expressa a importância do Nilo para:',

                        { letter: 'B', text: 'O desenvolvimento da agricultura e a concentração de poder faraônico.' },

                        { letter: 'E', text: 'O comércio marítimo com povos europeus.' }
                    ],
                    correctAnswer: 1,
                    explanation: 'O rio Nilo foi fundamental para a agricultura egípcia, pois suas cheias periódicas fertilizavam as margens.'
                },
                {
                    id: 2,
                    topic: 'egito',
                    bank: 'enem-2023',
                    difficulty: 'medium',
                    text: 'A prática do embalsamamento no Egito Antigo estava diretamente relacionada a:',
                    context: 'O embalsamamento era um processo complexo que levava semanas.',
                    options: [
                        { letter: 'A', text: 'Técnicas médicas avançadas de preservação de órgãos.' },
                        { letter: 'B', text: 'Crenças religiosas sobre a vida após a morte e a imortalidade da alma.' },
                        { letter: 'C', text: 'Métodos econômicos de controle populacional entre as classes pobres.' },
                        { letter: 'D', text: 'Práticas de sacrifício animal para agradar aos deuses.' },
                        { letter: 'E', text: 'Demonstrações de poder militar através de desfiles fúnebres.' }
                    ],
                    correctAnswer: 1,
                    explanation: 'Os egípcios acreditavam na vida após a morte (Duat) e que a alma precisava de um corpo preservado.'
                },
                {
                    id: 3,
                    topic: 'mesopotamia',
                    bank: 'fuvest-2024',
                    difficulty: 'easy',
                    text: 'A Mesopotâmia recebe esse nome porque:',
                    context: 'O termo vem do grego: "meso" (meio) + "potamos" (rio).',
                    options: [
                        { letter: 'A', text: 'Era uma região desértica entre montanhas e oásis.' },

                {

                    difficulty: 'medium',
                    text: 'Uma diferença fundamental entre o Egito e a Mesopotâmia era:',
                    context: 'Ambas as civilizações eram baseadas em rios, mas com características distintas.',

                {

                    text: 'O principal legado religioso do povo hebreu para a história foi:',

                {

                    topic: 'fenícios',
                    bank: 'enem-2024',
                    difficulty: 'easy',
                    text: 'Os fenícios eram conhecidos principalmente por:',

                    correctAnswer: 2,
                    explanation: 'Os fenícios eram talassocráticos e estabeleceram uma rede comercial pelo Mediterrâneo.'

                {

            const loadFromStorage = () => {
                const saved = localStorage.getItem('questionsData');
                if (saved) questionsData = JSON.parse(saved);
            };

            const saveToStorage = () => {
                localStorage.setItem('questionsData', JSON.stringify(questionsData));
            };

            return {
                getAll: () => [...questionsData],
                getById: (id) => questionsData.find(q => q.id === id),
                add: (question) => {
                    const newId = Math.max(...questionsData.map(q => q.id), 0) + 1;
                    question.id = newId;
                    questionsData.push(question);
                    saveToStorage();
                    return newId;
                },
                update: (id, question) => {
                    const index = questionsData.findIndex(q => q.id === id);
                    if (index !== -1) {
                        questionsData[index] = { ...question, id };
                        saveToStorage();
                    }
                },
                delete: (id) => {
                    questionsData = questionsData.filter(q => q.id !== id);
                    saveToStorage();
                },
                filter: (filters) => {
                    return questionsData.filter(q => {
                        return (!filters.topic || q.topic === filters.topic) &&
                               (!filters.bank || q.bank === filters.bank) &&
                               (!filters.difficulty || q.difficulty === filters.difficulty);

                        return;

                    state.quizMode = true;
                    state.quizIndex = 0;

                    document.getElementById('quizContainer').innerHTML = render.quizQuestion(0);

                    if (state.quizIndex < state.filteredQuestions.length - 1) {
                        state.quizIndex++;
                        document.getElementById('quizContainer').innerHTML = render.quizQuestion(state.quizIndex);

                        UI.finishQuiz();

                    const total = state.filteredQuestions.length;

                    const topic = document.getElementById('formTopic').value;
                    const bank = document.getElementById('formBank').value;
                    const difficulty = document.getElementById('formDifficulty').value;
                    const text = document.getElementById('formQuestion').value;
                    const context = document.getElementById('formContext').value;
                    const correctAnswer = parseInt(document.getElementById('formCorrectAnswer').value);
                    const explanation = document.getElementById('formExplanation').value;

                    if (!topic || !bank || !text || isNaN(correctAnswer) || !explanation) {
                        alert('Preencha todos os campos obrigatórios!');
                        return;
                    }

                    const options = [];
                    ['A', 'B', 'C', 'D', 'E'].forEach((letter, idx) => {
                        const optionText = document.getElementById(`option${idx}`).value;
                        if (!optionText) {
                            alert(`Preencha a alternativa ${letter}!`);
                            return;
                        }
                        options.push({ letter, text: optionText });
                    });

                    const question = { topic, bank, difficulty, text, context, options, correctAnswer, explanation };

                    if (state.editingId) {
                        DataModule.update(state.editingId, question);
                    } else {
                        DataModule.add(question);
                    }

                    document.getElementById('successMessage').classList.add('show');
                    setTimeout(() => {
                        UI.closeAddModal();
                        render.questionsList();
                        render.gerenciador();
                    }, 1500);
                },

                editQuestion: (id) => {
                    const question = DataModule.getById(id);
                    state.editingId = id;
                    document.getElementById('modalTitle').textContent = 'Editar Questão';
                    document.getElementById('questionForm').innerHTML = UI.getQuestionForm();
                    
                    document.getElementById('formTopic').value = question.topic;
                    document.getElementById('formBank').value = question.bank;
                    document.getElementById('formDifficulty').value = question.difficulty;
                    document.getElementById('formQuestion').value = question.text;
                    document.getElementById('formContext').value = question.context;
                    document.getElementById('formCorrectAnswer').value = question.correctAnswer;
                    document.getElementById('formExplanation').value = question.explanation;
                    question.options.forEach((opt, idx) => {
                        document.getElementById(`option${idx}`).value = opt.text;
                    });

                    document.getElementById('questionModal').classList.add('active');
                },

                deleteQuestion: (id) => {
                    if (confirm('Tem certeza que deseja deletar essa questão?')) {
                        DataModule.delete(id);
                        render.questionsList();
                    }
                },

                filterQuestionsList: () => {
                    const search = document.getElementById('searchQuestions').value.toLowerCase();
                    const cards = document.querySelectorAll('.question-card');
                    cards.forEach(card => {
                        const text = card.textContent.toLowerCase();
                        card.style.display = text.includes(search) ? 'block' : 'none';
                    });
                },

                exportQuestions: () => {
                    const json = JSON.stringify(DataModule.getAll(), null, 2);
                    document.getElementById('exportJsonArea').value = json;
                },

                importQuestions: () => {
                    const json = document.getElementById('importJsonArea').value;
                    try {
                        const imported = JSON.parse(json);
                        if (!Array.isArray(imported)) throw new Error('Formato inválido');
                        imported.forEach(q => DataModule.add(q));
                        alert('✓ Questões importadas com sucesso!');
                        document.getElementById('importJsonArea').value = '';
                        render.importar();
                    } catch (e) {
                        alert('Erro ao importar: ' + e.message);
                    }
                },

                copyToClipboard: () => {
                    const area = document.getElementById('exportJsonArea');
                    area.select();
                    document.execCommand('copy');
                    alert('✓ Copiado para área de transferência!');
                }
            };
        })();

        // ============================================
        // 4. INICIALIZAÇÃO
        // ============================================
        window.addEventListener('load', () => UI.init());
    </script>
</body>
</html>
